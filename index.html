<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mathieu &amp; Sophie — Save the Date</title>
  <meta name="description" content="Save the Date : le mariage de Mathieu &amp; Sophie le 23 octobre 2027 au Domaine de Fourniol à Septfonds.">
  <meta name="theme-color" content="#1c0b13">
  <!-- Site privé : ne pas apparaître dans les moteurs de recherche -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <link rel="preload" href="fonts/unifrakturmaguntia-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Motifs réutilisables : amanite tue-mouches, nain de jardin, lanterne -->
  <svg class="defs" width="0" height="0" aria-hidden="true">
    <defs>
      <radialGradient id="cap-red" cx="38%" cy="28%" r="78%">
        <stop offset="0" stop-color="#ff5a3c"/>
        <stop offset=".5" stop-color="#d0231a"/>
        <stop offset="1" stop-color="#7c0f08"/>
      </radialGradient>
      <radialGradient id="lantern-light">
        <stop offset="0" stop-color="#f5e8cf" stop-opacity=".75"/>
        <stop offset="1" stop-color="#e6b85c" stop-opacity="0"/>
      </radialGradient>

      <symbol id="amanita" viewBox="0 0 60 70">
        <path d="M21 70 Q18 63 25 60 L26.5 34 H33.5 L35 60 Q42 63 39 70Z" fill="#f4ebda"/>
        <path d="M23.5 45 Q30 49 36.5 45 L37.5 49 Q30 53 22.5 49Z" fill="#e2d3b8"/>
        <ellipse cx="30" cy="36" rx="21" ry="3.5" fill="#e6d4b4"/>
        <path d="M6 36 Q7 7 30 6 Q53 7 54 36 Q30 41 6 36Z" fill="url(#cap-red)"/>
        <g fill="#fffaf0">
          <circle cx="18" cy="22" r="3.2"/><circle cx="30" cy="13" r="2.6"/>
          <circle cx="41" cy="23" r="3.4"/><circle cx="25" cy="31" r="2.2"/>
          <circle cx="47" cy="32" r="2"/><circle cx="12" cy="31" r="1.8"/>
          <circle cx="35" cy="32" r="1.6"/><circle cx="21" cy="14" r="1.8"/>
          <circle cx="40" cy="12" r="1.6"/>
        </g>
      </symbol>

      <symbol id="gnome" viewBox="0 0 80 130">
        <ellipse cx="40" cy="126" rx="26" ry="3.5" fill="#000" opacity=".35"/>
        <ellipse cx="30" cy="123" rx="10" ry="5" fill="#4a1a24"/>
        <ellipse cx="50" cy="123" rx="10" ry="5" fill="#4a1a24"/>
        <path class="g-tunic" d="M18 121 Q16 80 40 68 Q64 80 62 121Z"/>
        <path class="g-tunic" d="M25 78 Q12 88 14 102 L22 102 Q22 90 31 83Z"/>
        <path class="g-tunic" d="M55 78 Q68 88 66 102 L58 102 Q58 90 49 83Z"/>
        <rect x="17.5" y="100" width="45" height="6" fill="#3a1418"/>
        <rect x="36" y="99" width="8" height="8" rx="1" fill="none" stroke="#e6b85c" stroke-width="1.6"/>
        <circle cx="18" cy="104" r="4.5" fill="#f1c3a0"/>
        <circle cx="62" cy="104" r="4.5" fill="#f1c3a0"/>
        <ellipse cx="40" cy="60" rx="12" ry="9" fill="#f1c3a0"/>
        <circle cx="31" cy="59" r="2.6" fill="#e5806c" opacity=".6"/>
        <circle cx="49" cy="59" r="2.6" fill="#e5806c" opacity=".6"/>
        <path d="M28 60 Q34 66 40 64 Q46 66 52 60 Q58 84 40 98 Q22 84 28 60Z" fill="#f5e8cf"/>
        <g class="g-eyes" fill="#2a0e18">
          <ellipse cx="35" cy="57" rx="1.5" ry="1.9"/><ellipse cx="45" cy="57" rx="1.5" ry="1.9"/>
        </g>
        <path d="M40 64 Q33 60 28 66 Q34 68 40 65.5 Q46 68 52 66 Q47 60 40 64Z" fill="#fffaf0"/>
        <circle cx="40" cy="61.5" r="4.5" fill="#e79a7f"/>
        <path class="g-hat" d="M25 54 Q30 28 42 6 Q46 2 48 9 Q50 30 56 54 Q40 50 25 54Z"/>
        <path d="M28 46 Q34 24 43 9" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2" stroke-linecap="round"/>
      </symbol>

      <symbol id="lantern" viewBox="0 0 20 30">
        <path d="M5 7 Q10 -1 15 7" fill="none" stroke="#2b1a10" stroke-width="1.6"/>
        <rect x="5" y="9" width="10" height="13" rx="1" fill="#f0d49a" opacity=".9"/>
        <ellipse class="flame" cx="10" cy="16" rx="2.4" ry="4" fill="#fffaf0"/>
        <path d="M3.5 9 L6 5.5 H14 L16.5 9Z M3.5 22 H16.5 V25 H3.5Z" fill="#2b1a10"/>
        <path d="M5 9 V22 M15 9 V22" stroke="#2b1a10" stroke-width="1"/>
      </symbol>

      <!-- Nain volant : ailes de libellule crème bordées d'or, traînée d'étincelles -->
      <symbol id="flyer" viewBox="0 0 130 140">
        <g class="sparks" fill="#f5e8cf">
          <circle class="spark" cx="34" cy="126" r="2.2"/>
          <circle class="spark" cx="20" cy="116" r="1.6" style="animation-delay:.4s"/>
          <circle class="spark" cx="10" cy="132" r="1.3" style="animation-delay:.8s"/>
          <circle class="spark" cx="2" cy="120" r="1" style="animation-delay:.2s"/>
        </g>
        <g class="wing wing-l" fill="rgba(245, 232, 207, .45)" stroke="#e6b85c" stroke-width=".9">
          <path d="M60 82 C40 50 6 52 10 70 C14 86 44 90 60 84Z"/>
          <path d="M60 86 C44 96 24 108 30 116 C38 122 54 100 60 88Z"/>
          <path d="M60 83 C44 70 26 66 16 68 M60 87 C48 98 38 108 32 114" fill="none" stroke-opacity=".6" stroke-width=".6"/>
        </g>
        <g class="wing wing-r" fill="rgba(245, 232, 207, .45)" stroke="#e6b85c" stroke-width=".9">
          <path d="M70 82 C90 50 124 52 120 70 C116 86 86 90 70 84Z"/>
          <path d="M70 86 C86 96 106 108 100 116 C92 122 76 100 70 88Z"/>
          <path d="M70 83 C86 70 104 66 114 68 M70 87 C82 98 92 108 98 114" fill="none" stroke-opacity=".6" stroke-width=".6"/>
        </g>
        <use href="#gnome" x="25" y="5" width="80" height="130"/>
      </symbol>
    </defs>
  </svg>

  <!-- Décor : ciel, lune, brume, forêt, nains, amanites, lucioles, feuilles -->
  <div class="scene" aria-hidden="true">
    <div class="stars"></div>
    <div class="moon"></div>
    <div class="rays"></div>
    <svg class="forest forest-far" preserveAspectRatio="none"></svg>
    <div class="mist mist-back"></div>
    <svg class="forest forest-mid" preserveAspectRatio="none"></svg>
    <div class="mist mist-front"></div>
    <svg class="forest forest-near" preserveAspectRatio="none"></svg>
    <div class="leaf-litter"></div>
    <!-- Petits nains volants qui traversent le ciel -->
    <div class="flyer" style="--y:13%;--w:64px;--dur:34s;--delay:-6s;--bob:3s;--rest:8%">
      <div class="flyer-bob"><svg viewBox="0 0 130 140"><use href="#flyer" style="--tunic:#5e2546;--hat:#c4623f"/></svg></div>
    </div>
    <div class="flyer rtl" style="--y:27%;--w:48px;--dur:42s;--delay:-24s;--bob:2.4s;--rest:80%">
      <div class="flyer-bob"><svg viewBox="0 0 130 140"><use href="#flyer" style="--tunic:#cc8a2e;--hat:#6d1f35"/></svg></div>
    </div>
    <div class="flyer far" style="--y:6%;--w:34px;--dur:58s;--delay:-40s;--bob:3.6s;--rest:60%">
      <div class="flyer-bob"><svg viewBox="0 0 130 140"><use href="#flyer" style="--tunic:#6d1f35;--hat:#c8571e"/></svg></div>
    </div>
    <!-- Nain à la lanterne et amanites, à gauche -->
    <svg class="grove grove-left" viewBox="0 0 240 150">
      <use class="shroom" href="#amanita" x="-4" y="66" width="72" height="84"/>
      <g class="gnome">
        <circle class="lantern-glow" cx="132" cy="136" r="36" fill="url(#lantern-light)"/>
        <use href="#gnome" x="70" y="20" width="80" height="130" style="--blink:.4s"/>
        <use href="#lantern" x="124" y="123" width="16" height="24"/>
      </g>
      <use class="shroom" href="#amanita" x="50" y="122" width="24" height="28" style="--delay:1.4s"/>
      <use class="shroom" href="#amanita" x="152" y="92" width="50" height="58" style="--delay:.7s"/>
      <use class="shroom" href="#amanita" x="203" y="115" width="30" height="35" style="--delay:2s"/>
    </svg>
    <!-- Nain cueilleur et grande amanite, à droite -->
    <svg class="grove grove-right" viewBox="0 0 240 150">
      <use class="shroom" href="#amanita" x="8" y="108" width="36" height="42" style="--delay:.6s"/>
      <use class="shroom" href="#amanita" x="46" y="124" width="22" height="26" style="--delay:1.1s"/>
      <g class="gnome" style="--sway-delay:-2.5s">
        <g transform="translate(170 20) scale(-1 1)">
          <use href="#gnome" width="80" height="130" style="--tunic:#cc8a2e;--hat:#6d1f35;--blink:2.3s"/>
        </g>
        <use href="#amanita" x="98" y="104" width="20" height="24"/>
      </g>
      <use class="shroom" href="#amanita" x="160" y="58" width="78" height="92" style="--delay:1.8s"/>
    </svg>
    <canvas id="fireflies"></canvas>
    <div class="leaves"></div>
  </div>

  <main class="card">
    <svg class="vine vine-top" viewBox="0 0 400 40" aria-hidden="true">
      <path d="M10 30 C 80 0, 140 40, 200 18 S 320 0, 390 30" />
      <g class="vine-leaves">
        <path d="M70 16 q10 -14 22 -6 q-10 12 -22 6z" />
        <path d="M130 26 q12 8 22 -2 q-12 -10 -22 2z" />
        <path d="M200 18 q-4 -16 8 -20 q6 14 -8 20z" />
        <path d="M270 12 q10 -12 22 -4 q-10 12 -22 4z" />
        <path d="M330 18 q12 10 22 0 q-12 -10 -22 0z" />
      </g>
    </svg>

    <p class="eyebrow reveal">Save the Date</p>
    <p class="subtitle reveal">Nous nous marions !</p>
    <h1 class="title reveal"><span>Mathieu</span> <span class="amp">&amp;</span> <span>Sophie</span></h1>

    <div class="divider reveal" aria-hidden="true">
      <svg viewBox="0 0 60 70"><use href="#amanita"/></svg>
    </div>

    <p class="date reveal">
      <time datetime="2027-10-23">Samedi 23 octobre 2027</time>
    </p>
    <p class="place reveal">
      Domaine de Fourniol<br>
      <span>Septfonds · Tarn-et-Garonne</span>
    </p>

    <section class="countdown reveal" aria-label="Compte à rebours">
      <div class="unit"><span id="days">--</span><small>Jours</small></div>
      <div class="unit"><span id="hours">--</span><small>Heures</small></div>
      <div class="unit"><span id="minutes">--</span><small>Minutes</small></div>
      <div class="unit"><span id="seconds">--</span><small>Secondes</small></div>
    </section>
    <p id="done" class="done" hidden>C'est le grand jour ! 💍</p>

    <div class="actions reveal">
      <a class="btn" id="add-calendar" href="#" download="mariage-mathieu-sophie.ics">Ajouter au calendrier</a>
      <a class="btn btn-ghost" href="https://www.google.com/maps/search/?api=1&query=380+Rte+de+la+Fourniol%2C+82240+Septfonds" target="_blank" rel="noopener">Voir sur la carte</a>
    </div>

    <p class="note reveal">Faire-part à suivre…</p>

    <p class="legal-link reveal"><a href="mentions-legales.html">Mentions légales</a></p>

    <svg class="card-shrooms reveal" viewBox="0 0 70 40" aria-hidden="true">
      <use href="#amanita" x="0" y="6" width="30" height="34"/>
      <use href="#amanita" x="26" y="18" width="19" height="22"/>
      <use href="#amanita" x="44" y="26" width="12" height="14"/>
    </svg>

    <svg class="vine vine-bottom" viewBox="0 0 400 40" aria-hidden="true">
      <path d="M10 30 C 80 0, 140 40, 200 18 S 320 0, 390 30" />
      <g class="vine-leaves">
        <path d="M70 16 q10 -14 22 -6 q-10 12 -22 6z" />
        <path d="M130 26 q12 8 22 -2 q-12 -10 -22 2z" />
        <path d="M200 18 q-4 -16 8 -20 q6 14 -8 20z" />
        <path d="M270 12 q10 -12 22 -4 q-10 12 -22 4z" />
        <path d="M330 18 q12 10 22 0 q-12 -10 -22 0z" />
      </g>
    </svg>
  </main>

  <!-- Quelques grandes feuilles floues qui passent devant la carte -->
  <div class="leaves-front" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
