<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sophie &amp; Mathieu — Save the Date</title>
  <meta name="description" content="Save the Date : le mariage de Sophie &amp; Mathieu le 23 octobre 2027 au Domaine de Fourniol à Septfonds.">
  <meta name="theme-color" content="#1e3111">
  <link rel="preload" href="images/faire-part.webp" as="image">
  <link rel="preload" href="images/foret.webp" as="image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Décor derrière le faire-part : forêt enchantée, halo, brume -->
  <div class="scene scene-back" aria-hidden="true">
    <div class="backdrop"></div>
    <div class="halo"></div>
    <div class="mist mist-back"></div>
    <div class="leaves"></div>
  </div>

  <main class="invite">
    <!-- Le faire-part (parchemin, dragon, épée) ; les prénoms font partie de l'image -->
    <div class="card">
      <img class="card-art" src="images/faire-part.webp" width="852" height="1267"
           alt="Faire-part : parchemin orné de gravures florales, un dragon vert agrippé en haut à droite et une épée en bas à gauche. Sophie et Mathieu — Nous nous marions.">
      <h1 class="sr-only">Sophie et Mathieu — Nous nous marions</h1>

      <!-- Reflets scintillants sur les pierres de l'épée -->
      <span class="sparkle" style="--x:28%; --y:78.6%" aria-hidden="true"></span>
      <span class="sparkle" style="--x:14.7%; --y:88%; --delay:1.7s" aria-hidden="true"></span>

      <div class="content">
        <p class="eyebrow reveal">Save the Date</p>

        <div class="ornament reveal" aria-hidden="true">
          <svg viewBox="0 0 120 12"><path d="M2 6 H48 M72 6 H118 M60 1 L65 6 L60 11 L55 6 Z" /></svg>
        </div>

        <p class="date reveal">
          <span class="weekday">Samedi</span>
          <time datetime="2027-10-23">23 octobre 2027</time>
        </p>

        <p class="place reveal">
          Domaine de Fourniol
          <span>Septfonds · Tarn-et-Garonne</span>
        </p>

        <section class="countdown reveal" aria-label="Compte à rebours">
          <div class="unit"><span id="days">--</span><small>jours</small></div>
          <div class="unit"><span id="hours">--</span><small>heures</small></div>
          <div class="unit"><span id="minutes">--</span><small>minutes</small></div>
          <div class="unit"><span id="seconds">--</span><small>secondes</small></div>
        </section>
        <p id="done" class="done" hidden>C'est le grand jour !</p>

        <p class="note reveal">Faire-part à suivre…</p>
      </div>
    </div>

    <div class="actions reveal">
      <a class="btn" id="add-calendar" href="#" download="mariage-sophie-mathieu.ics">Ajouter au calendrier</a>
      <a class="btn btn-ghost" href="https://www.google.com/maps/search/?api=1&query=Domaine+de+Fourniol+Septfonds" target="_blank" rel="noopener">Voir sur la carte</a>
    </div>
  </main>

  <!-- Décor devant le faire-part : brume, lucioles, feuilles -->
  <div class="scene scene-front" aria-hidden="true">
    <div class="mist mist-front"></div>
    <canvas id="fireflies"></canvas>
    <div class="leaves"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
