<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save the Date — 23 octobre 2027</title>
  <meta name="description" content="Save the Date : notre mariage le 23 octobre 2027 au Domaine de Fourniol à Septfonds.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">Save the Date</p>
    <h1 class="title">Notre Mariage</h1>

    <div class="divider" aria-hidden="true"><span>❦</span></div>

    <p class="date">
      <time datetime="2027-10-23">Samedi 23 octobre 2027</time>
    </p>
    <p class="place">
      Domaine de Fourniol<br>
      <span>Septfonds · Tarn-et-Garonne</span>
    </p>

    <section class="countdown" aria-live="polite" aria-label="Compte à rebours">
      <div class="unit"><span id="days">--</span><small>Jours</small></div>
      <div class="unit"><span id="hours">--</span><small>Heures</small></div>
      <div class="unit"><span id="minutes">--</span><small>Minutes</small></div>
      <div class="unit"><span id="seconds">--</span><small>Secondes</small></div>
    </section>
    <p id="done" class="done" hidden>C'est le grand jour ! 💍</p>

    <div class="actions">
      <a class="btn" id="add-calendar" href="#" download="mariage-23-octobre-2027.ics">Ajouter au calendrier</a>
      <a class="btn btn-ghost" href="https://www.google.com/maps/search/?api=1&query=Domaine+de+Fourniol+Septfonds" target="_blank" rel="noopener">Voir sur la carte</a>
    </div>

    <p class="note">Faire-part à suivre…</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
